name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr tests del backend con cobertura
        run: |
          mkdir -p coverage/backend
          docker run --rm -v ${{ github.workspace }}/coverage/backend:/app/coverage backend-test:ci

      - name: Resumen de cobertura (backend)
        if: always()
        run: |
          echo "### Cobertura — backend" >> $GITHUB_STEP_SUMMARY
          node -e "
            const s = require('./coverage/backend/reporte/coverage-summary.json').total;
            console.log('- Líneas: ' + s.lines.pct + '%');
            console.log('- Ramas: ' + s.branches.pct + '%');
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar reporte completo (backend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage/backend/reporte

      - name: Login a GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr tests del frontend con cobertura
        run: |
          mkdir -p coverage/frontend
          docker run --rm -v ${{ github.workspace }}/coverage/frontend:/app/coverage frontend-test:ci

      - name: Resumen de cobertura (frontend)
        if: always()
        run: |
          echo "### Cobertura — frontend" >> $GITHUB_STEP_SUMMARY
          node -e "
            const s = require('./coverage/frontend/reporte/coverage-summary.json').total;
            console.log('- Líneas: ' + s.lines.pct + '%');
            console.log('- Ramas: ' + s.branches.pct + '%');
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar reporte completo (frontend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/frontend/reporte

      - name: Login a GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qa
    env:
      HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
      HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
    steps:
      - name: Desplegar en QA la imagen del commit verificado
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "${HOOK_API}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "${HOOK_FRONT}"

      - name: Smoke test
        shell: bash
        env:
          URL_API: https://api-qa-dew8.onrender.com
          URL_FRONT: https://front-qa-5udf.onrender.com
        run: |
          for i in $(seq 1 30); do
            if curl -sf --max-time 10 "$URL_API/health" \
              && curl -sf --max-time 10 "$URL_API/api/marcas" > /dev/null \
              && curl -sf --max-time 10 "$URL_FRONT" > /dev/null; then
              echo "QA responde"
              exit 0
            fi
            sleep 20
          done
          echo "QA no respondio despues de los reintentos"
          exit 1

  integracion:
    needs: [deploy-qa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Tests de integración contra la API de QA
        working-directory: frontend
        env:
          API_BASE_URL: https://api-qa-dew8.onrender.com
        run: npx playwright test e2e/api.spec.js
      - name: Publicar reporte de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report

  e2e:
    needs: [integracion]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Tests e2e contra QA desplegado
        working-directory: frontend
        env:
          E2E_BASE_URL: https://front-qa-5udf.onrender.com
        run: npx playwright test e2e/autos.spec.js
      - name: Publicar reporte e2e
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report

  deploy-prod:
    needs: [e2e]
    concurrency: deploy-prod
    runs-on: ubuntu-latest
    environment: production
    env:
      HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
      HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
    steps:
      - name: Desplegar en PROD la misma imagen que verificó QA
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "${HOOK_API}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "${HOOK_FRONT}"

      - name: Smoke test
        shell: bash
        env:
          URL_API: https://api-prod-2p7g.onrender.com
          URL_FRONT: https://front-prod-pdou.onrender.com
        run: |
          for i in $(seq 1 30); do
            if curl -sf --max-time 10 "$URL_API/health" \
              && curl -sf --max-time 10 "$URL_API/api/marcas" > /dev/null \
              && curl -sf --max-time 10 "$URL_FRONT" > /dev/null; then
              echo "PROD responde"
              exit 0
            fi
            sleep 20
          done
          echo "PROD no respondio despues de los reintentos"
          exit 1
