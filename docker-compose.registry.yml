services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/danteferrer/mi-backend:v0.1.1
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: app
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/danteferrer/mi-frontend:v0.1.1
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  db_data:
